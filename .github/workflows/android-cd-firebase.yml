# =============================================================================
#  BONUS (optional) — CONTINUOUS DELIVERY to Firebase App Distribution
#  Goal: on every push to main, Fastlane tests, builds and uploads the APK
#  to Firebase App Distribution. Complete every "TODO".
# =============================================================================
name: CD - Firebase App Distribution

on:
  # Bonus: manual only. When it works, add "push: branches: [main]" here.
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes shown to testers (empty = last commits)"
        required: false
        default: ""

concurrency:
  group: cd-firebase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  distribute:
    name: Build & distribute to testers
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # TODO 3.1 — expose the repository secrets as env variables:
      #   FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT_JSON
      #   (optional) KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      #   syntax: NAME: ${{ secrets.NAME }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'classmates' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout code (full history for the changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # why is this needed? (hint: changelog_from_git_commits)

      - name: Check required secrets
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_APP_ID or FIREBASE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # TODO 3.2 — install Ruby 3.3 with ruby/setup-ruby@v1
      #   and let it run "bundle install" + cache the gems (option bundler-cache)

      # TODO 3.3 — the service account JSON is in $FIREBASE_SERVICE_ACCOUNT_JSON.
      #   Write it to "$RUNNER_TEMP/firebase-sa.json" and export
      #   FIREBASE_SERVICE_ACCOUNT_PATH=<that path> through "$GITHUB_ENV"
      #   (NEVER write it inside the repository folder)

      - name: Decode release keystore (only if the secret exists)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # TODO 3.4 — run the Fastlane lane "distribute" of the android platform
      #   through Bundler, and pass RELEASE_NOTES = the workflow_dispatch input

      - name: Keep the release APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapcampus-release-${{ github.run_number }}
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Clean up secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/release.jks"
